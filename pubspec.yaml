name: ai_gym_flutter
description: AI Gym Cloud - Flutter workout and health tracking app with on-device camera object detection on Android and iOS, plus Supabase account sync.
publish_to: "none"
version: 4.1.0+23
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.2
  camera: ^0.12.1
  camera_android_camerax: ^0.7.4+8
  camera_windows: ^0.2.6+2
  google_mlkit_object_detection: ^0.17.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  device_info_plus: ^13.3.0
  uuid: ^4.5.1
  camera_macos: 0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
