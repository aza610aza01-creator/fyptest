<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Gym Cloud — 6-Digit Verification Code</title>
</head>
<body style="margin:0;padding:28px 16px;background-color:#070B10;color:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;margin:0 auto;background-color:#121721;border:1px solid #283246;border-radius:20px;padding:32px 28px;">
    <tr>
      <td align="center" style="padding-bottom:18px;">
        <!-- Inline SVG Kinetic Shield Mark -->
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5L19.5 5.8V11.8C19.5 18.2 12 21.5 12 21.5C12 21.5 4.5 18.2 4.5 11.8V5.8L12 2.5Z" fill="#9ED756" fill-opacity="0.16" stroke="#9ED756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.8 12.2L11.1 14.5L15.5 9.5" stroke="#5CE1E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 style="margin:12px 0 4px;font-size:20px;font-weight:800;color:#F5F7FA;letter-spacing:-0.3px;">AI Gym Cloud Verification Code</h1>
        <p style="margin:0;font-size:13px;color:#98A4B8;">Enter the 6-digit verification code below in the AI Gym Cloud app</p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:20px 0;">
        <div style="display:inline-block;background-color:#070B10;border:2px solid #9ED756;border-radius:16px;padding:16px 32px;font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:34px;font-weight:900;letter-spacing:10px;color:#9ED756;">
          {{ .Token }}
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:8px;">
        <p style="margin:0 0 12px;font-size:13px;color:#98A4B8;line-height:1.5;">
          This code expires in <strong>60 minutes</strong> and is bound to <strong>{{ .Email }}</strong>.<br/>
          If you prefer one-click verification on this device, you can also use the link below:
        </p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:10px 20px;background-color:#181E2A;border:1px solid #283246;border-radius:10px;color:#5CE1E6;text-decoration:none;font-size:12px;font-weight:700;">
          Verify Automatically via Secure Link
        </a>
      </td>
    </tr>
  </table>
</body>
</html>
